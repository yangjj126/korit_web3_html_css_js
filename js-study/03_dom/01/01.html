<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title"></h1>
    <section class="list">
        <ul></ul>
    </section> <!-- js로 애내 조작할거임 -->
</body>
<script>
    // js코드 작성
    // dom api - id를 통해 요소를 찾는 방법
    const title = document.getElementById("title") // document는 최상위 부모
    console.log(title);
    

    // 리스트에 객체들을 담아서 들고 옴
    const list = document.getElementsByClassName("list")
    console.log(list);

    // **css 선택자로 특정 태그를 가져올 수 있다
    const ul = document.querySelector(".list > ul")
    console.log(ul);

    // 내부의 텍스트를 조작 할 수 있다
    title.innerText = "TODO LIST";
    
    // CSS 조작도 가능 하다
    title.style.fontSize = "60px";
    title.style.margin = "5px 0px";
    title.style.textAlign = "center"; // dom API사용함

    ul.style.fontSize = "24px";
    // ul안쪽의 html을 직접 수정이 가능하다
    ul.innerHTML = "<li>js 공부하기</li>";
    
    // HTML 객체를 만들 수 있음
    // 브라우져가 바뀐 HTML을 다시 읽을 필요가 없음
    const myLi = document.createElement("li");
    myLi.innerText = "python 공부하기";
    ul.appendChild(myLi); // ul아래에 myLi를 추가추가 만들기만들기

    // 많은 데이터 리스트가 있을 경우에,
    const todoList = [
        "java 공부하기",
        "springBoot 공부하기",
        "css 공부하기"
    ];
   
    // 이걸 하나하나 전부 li로 만들어 줄 수 있다
    // 1.
    for (let todo of todoList) {
        let todoLi = document.createElement("li");
        todoLi.innerText = todo;
        ul.appendChild(todoLi);
    }
    
    // 2.
    todoList.forEach((todo) => {
        ul.innerHTML += `<li>${todo}</li>`;
    })
</script>
</html>
