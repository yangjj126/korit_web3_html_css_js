<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    브라우져가 html파일을 읽는 방법
    모든 태그들을 계층을 가진 tree 구조로 변환해서 파악한다
    브라우져 : html -> Dom(js개입가능-webApi) -> Render(css개입) -> 화면

    JS로 DOM API(Web API)-(JS입장에서 외부)를 사용하여,
    DOM객체를 조작할 수 있다
    -->
    <div>
        <header>
            <p>헤더</p>
        </header>
        <main>
            <p>메인</p>
        </main>
    </div>
</body>
</html>

<!--html자체를 하나의 객체로 읽겠디-->
