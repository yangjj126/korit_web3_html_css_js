<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input {
            margin-bottom: 5px;
            padding: 6px;
        }
        .error {
            color: red;
            font-size: 12px;
        }
        .success {
            color: green;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>회원가입</h1>
    <div>
        <input type="text" id="username" placeholder="아이디">
        <span id="username-msg"></span>
    </div>
    <div>
        <input type="password" id="password" placeholder="비밀번호">
        <span id="password-msg"></span>
    </div>
    <div>
        <input type="text" id="email" placeholder="이메일">
        <span id="email-msg"></span>
    </div>
    <button id="submit">가입</button>
</body>
<script>
// [input, input, input] -- 아래코드
const inputs = document.querySelectorAll("input");
// 반복을 돌면서, 이벤트 리스너 장착
inputs.forEach((input, idx) => { // 여기서 idx는 뭐임
    // keydown 이벤트 : 키보드 키가 눌리는 이벤트
    input.addEventListener("keydown", (e) => {
        // console.log(e.key);
        // 내가 누르고 있는 키들이 전부 감지 된다..
        const key = e.key;
        console.log(`${idx}번 input에 키 감지됨`);
        if (key === "Enter"){
            // 현재 input다음 input에 포커스해라
            inputs[idx + 1]?.focus();
        }

        if (key === "Tab"){
            // 브라우저에서 Tab키가 작동하는 기본동작
            // 제거
            e.preventDefault();
            inputs[idx -1]?.focus();
        }
    })
})

    const submitBtn = document.querySelector("#submit");
    const emailInput = document.querySelector("#email");
    // 이메일 input에서 Enter을 누르면,
    // 가입버튼이 focus()되게 해주세요!
    emailInput.addEventListener("keydown", (e) =>{
        const key = e.key;
        if (key === "Enter"){
            submitBtn.focus();
        }
    });
        submitBtn.addEventListener("click", () => {
        // 제출버튼 클릭시
        // 3개의 input중 하나라도 error라면, 
        // -> span태그중에 error클래스를 가진 얘가 있다
        // alert("압력값을 확인하세요")
        // 모두 success이면,
        // alert("회원가입 성공")
        // 정말 머리가 안돌아간다
        const errorMsg = document.querySelector(".error");
        // errorMsg 가 false로 존재하게끔
        if (errorMsg) {

            // errorMsg가 truty값으로 존재한다면
            // -> 하나라도 error클래스가 있다면
            alert("입력값을 확인하세요!")
            // error클래스를 가진 태그 이전
            errorMsg.previousElementSibling.focus();
            return;
        }
        alert("회원가입 성공!");
    })
</script>
</html>
