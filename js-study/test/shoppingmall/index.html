<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">ShoppingMall</div>
            <div class="menu-area">
                <ul class="menu">
                    <li>TOP</li>
                    <li>OUTER</li>
                    <li>BOTTOM</li>
                    <li>ACC</li>
                </ul>
            </div>
            <!-- cart를 누르면 장바구니 모달이 열림 -->
            <div class="cart">장바구니</div>
        </nav>
    </header>
    <main>
        <!-- 상품카드들이 렌더링(js로) -->
        <section class = "product-list"></section>
    </main>
    <div class="modal-overlay hidden">
        <!-- 사라졌다, 나타났다 하게끔 하려면, 
        1. class이름 뒤에 hidden을 붙여주고
        2. css에 .hidden { display: none } 을 걸어주면, 
            해당 class안에 있는 요소들은 다 안보이게 된다
        -->
        <div class="cart-modal">
            <div class="modal-header">
                <h2>장바구니</h2>
                <button class="close-btn">X</button>
            </div>
            <ul>
                <!-- localStorage에 있는 데이터로 렌더링 -->
            </ul>
            <div class="modal-footer">
                <button class="close-btn">닫기</button>
            </div>
        </div>
    </div>
</body>
<script>
    // dom 요소들
    const productList = document.querySelector(".product-list");

    // 장바구니 관련 dom 요소들 //
    const cartButton = document.querySelector(".cart");
    const modalOverlay = document.querySelector(".modal-overlay");
    const cartList = document.querySelector(".cart-list");
    const closeModalBtns = document.querySelector(".close-btn");


    // 전역변수
    let productDataList = [];
    const BASE_URL = "https://fakestoreapi.com/products";

    // fetch로 데이터들을 productDataList에 담는 함수
    const loadProducts = async () => {
        const response = await fetch(BASE_URL);
        const result = await response.json();

        // 받아온 데이터를 상태변수에 저장
        productDataList = result;

        // 동기적으로 렌더링()
        renderProducts(productDataList);
    }

     
    // productDataList 데이터들을 기반으로 렌더링하는 함수
    const renderProducts = (productDataList) => {
        // 기존에 있던 HTML을 삭제(중복 렌더링방지)
        productList.innerHTML = "";

        let myHtml = "";
        // 상품 하나당 카드 하나 만들어서 붙혀줌
        for(let product of productDataList) {
            const cardHTML = createProductCardHTML(product);
            myHtml += cardHTML;
        }

        productList.innerHTML = myHtml;
    }

    
    // HTML 조립하는 함수
    const createProductCardHTML = (product) => {
        const { image, title, price, id } = product;
        // 버튼을 누르면, product의 id를 추출할 수 있게
        // 전역에 있는 productDataList에서 id로 해당 상품을 특정해서
        // localStorage에 담아줄겁니다.

        const html = `
            <div class="product-card">
                <div class="image-box">
                    <img src="${image}" alt="${title}"/>
                </div>
                <h3 class="title">${title}</h3>
                <p class="price">$${price}</p>
                <button data-productId="${id}">상품담기</button>
            </div>
        `;
        return html;
    }

    const createCartCardHTML = (item) => {
    const {image, title, price, id, count} = item;
    const HTML = `
        <li class="cart-item">
            <img src = "${image}"/>
            <div class="cart-info">
                <p class="title">${title}</p>
                <p class="price">$${price}</p>
                <div class="quantity">
                    <button class="minus" data-id="${id}">-</button>
                    <span>${count}</span>
                    <button class="plus" data-id="${id}">+</button>
                </div>
            </div>
            <button class="delete-btn" data-id="${id}">삭제</button>
        </li>
    `;
    return HTML;
}

    // productList안에 card들을 만들어 줬음
    // card안에 버튼에서 이벤트가 생성이 되고, -> 전파.. -> productList에서 감지될것임
    productList.addEventListener("click", (e) => {
        // 버튼이 아니면, 바로 리턴
        const target = e.target;
        const targetName = target.tagName;
        
        if (targetName !== "BUTTON") {
            return;
        }

        const agree = confirm("장바구니에 담으시겠습니까?")
        if (!agree){
            return;
        }

        // 진짜로 복습을 해야 할것 같다
        
        // 아래부분은 button만 동작한다
        // 클릭한 버튼의 data-id를 가져와야 함
        const productId = target.setdata.proudctId;
        productId = parseInt(productId); // 숫자로 -> 숫자

        
        // id로 productDataList에서 상품을 가져옴(js객체)
        // let selectedProduct = {};
        // for (let productData of productDataList) {
        //     if (product.id === productId){
        //         selectedProduct = product;
        //         break;
        //     }
        // }

        // or findAPI사용 가능

        let selectedProduct = productDataList.find((product) => {
            return product.id === productId;
        })

        // 최초면, localStorage에 아무것도 없음
        // 삼항연산자 사용
        const savedCart = localStorage.getItem("cart");
        
        // 최초면, falsy, 최초가 아니면, truthy
        // 값 ? truthy일때 값 : falsy일때 값 --
        const cart = savedCart ? JSON.parse(savedCart) : [];
        
        // localStorage에 이미 상품이 존재한다면? 수량 증가
        // 없다면, 새로 추가한다 -> cart에 해당 id의 상품이 있는지 검사해야 한다
        const existingItem = cart.find((product) => {
            return product.id === selectedProduct.id
        });
        
        if (existingItem){ // cart에 이미 값이 있다면
            existingItem.count += 1;
        } else { // 없다면
            const {id, title, price, image} = selectedProduct;
            const newItem = {
                id : id,
                title : title,
                price : price,
                image : image,
                count: 1
            }
            cart.push(newItem);
        }


        // 로컬스토리지에 저장하기
        const savingData = JSON.stringify(cart);
        localStorage.setItem("cart", savingData);
        
    })


    const renderCart = () => {
        // 로컬스토리지에 있는 데이터를 기반으로 렌더링 해줄거임
        let cartData = localStorage.getItem("cart");
        // 저장된 cart데이터들

        if (!cartData){
            cartData = []; // 아무것도 안 담은 경우
        } else {
            cartData = JSON.parse(cartData);
        }

        cartList.innerHTML = ""; // 기존장바구니 목록 초기화

        const myHtml = "";
        for (let item of cartData) {
            const itemCartHTML = createCartCardHTML(item);
            myHtml += itemCardHTML;
        }

        // 완성 후 html 주입
        cartList.innerHTML = myHtml;
    }

   
    


    // 사라졌다, 나타났다 하게끔 하려면,
    // 1. class이름 뒤에 hidden을 붙여주고
    // 2. css에 .hidden { display: none } 을 걸어주면,
    //    해당 class안에 있는 요소들은 다 안보이게 된다
    cartButton.addEventListener( "click" , () => {
        // 모달을 보이게 하는 방법 - modalOverlay에 있는 hidden클래스를 제거한다
        modalOverlay.classList.remove("hidden");
        // 장바구니 모달안에 그려 주세요
        renderCart();
    })


    for (let btn of closeModalBtns){
        btn.addEventListener("click", () => {
            // 모달이 사라지게
            // 얘는 그러면, hidden을 붙여주면 된다
            modalOverlay.classList.add("hidden");
        })
    }

//         const createCartCardHTML = (item) => {
//     const {image, title, price, id, count} = item;
//     const HTML = `
//         <li class="cart-item">
//             <img src = "${image}"/>
//             <div class="cart-info">
//                 <p>${title}</p>
//                 <p>$${price}</p>
//                 <div class="quantity">
//                     <button class="minus" data-id="${id}">-</button>
//                     <span>${count}</span>
//                     <button class="plus" data-id="${id}">+</button>
//                 </div>
//             </div>
//             <button class="delete-btn" data-id="${id}">삭제</button>
//         </li>
//     `;
//     return HTML;
// }




    // 장바구니 내부 이벤트
    cardList.addEventListener("click", (e) => {
        // 1. ul에서 target.dataset.id로 li를 특정할거임
        // 2. class이름으로 어떤 버튼인지 특정
        const target = e.target;


        const clickItemId = target.dataset.id;
        // li를 특정 완료..
        clickItemId = parseInt(clickItemId);
        // 버튼들에만 id를 심어놨음



        // id가 없다면, return
        if (!clickItemId){
            return;
        }
        console.log(clickItemId);


        // 지금 무슨 로직을 하고 있는거지..

        // 로컬스토리지에서 데이터를 가져와서
        // 로컬스토리지에는 이미 데이터가 저장되어있는 상태임
        // 그리고 질문을 할꺼면, 제발 공부를 해와서 그걸 질문을 해라 
        let savedData = localStorage.getItem("cart");
        if (!savedData){
            savedData = [];
            // 정버구니에 아무것도 안 담았다면 (falsy라면)
        } else {
            savedData = JSON.parse(savedData);
            // 뭐라도 담았다면..(truthy라면)
        }

        // 해당 id의 상품을 특정
        // 복습해주기
        const targetItem = savedData.find((item) => {
            return item.id === clickItemId;
        })

        if (!targetItem){
            return;
        }
        // 해당 id의 상품을 특정 - js 객체
        // 버튼을 특정
        // plus클래스를 가지면, -> 객체.count + 1
        const isPlus = target.classList.contains("plus");
        if (isPlus){
            targetItem.count += 1;
        }

        // minus이면, -> 객체.count - 1
        const isMinus = target.classList.contains("minus");
        // boolean임
        // count가 1아래로 떨어지면 X
        // count가 음수가 되면, X
        if (isMinus){
            targetItem.count -= 1;
            if (targetItem.count < 0){
                targetItem.count = 1;
            }
        }
        

        

        // delete-btn -> cart에서 해당객체를 삭제
        const isDelete = target.classList.contains("delete-btn");
 
        
        
        // splice로 삭제
        if (isDelete){
            const agree = confirm("삭제하기겠습니까?")
        }
        // savedData에서 targetItem의 index를 찾아서,
        let targetIdx = -1;
        for (let i = 0; i<savedData,length; i++){
            if (savedData[i] === targetItem) {
                targetIdx = i;
            }
        }

        // 내일은 하루종일 JS복습만 해야 할듯.........................
        // .........................................................


        //        해당 id의 상품을 특정
        // const targetItem = savedData.find((item) => {
        //     return item.id === clickItemId;
        // })


        // 로컬스토리지에 다시 저장
        // 렌더링()
    })

    // 다음시간까지 무조건 복습 해라 그전것까지 제발...
    loadProducts();
</script>
</html>
