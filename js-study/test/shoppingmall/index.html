<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">ShoppingMall</div>
            <div class="menu-area">
                <ul class="menu">
                    <li>TOP</li>
                    <li>OUTER</li>
                    <li>BOTTOM</li>
                    <li>ACC</li>
                </ul>
            </div>
            <!-- cart를 누르면 장바구니 모달이 열림 -->
            <div class="cart">장바구니</div>
        </nav>
    </header>
    <main>
        <!-- 상품카드들이 렌더링(js로) -->
        <section class = "product-list"></section>
    </main>
    <div class="modal-overlay hidden">
        <div class="cart-modal">
            <div class="modal-header">
                <h2>장바구니</h2>
                <button class="close-btn">X</button>
            </div>
            <ul>
                <!-- localStorage에 있는 데이터로 렌더링 -->
            </ul>
            <div class="modal-footer">
                <button class="close-btn">닫기</button>
            </div>
        </div>
    </div>
</body>
<script>
    // dom 요소들
    const productList = document.querySelector(".product-list");



    // 전역변수
    let productDataList = [];
    const BASE_URL = "https://fakestoreapi.com/products";

    // fetch로 데이터들을 productDataList에 담는 함수
    const loadProducts = async () => {
        const response = await fetch(BASE_URL);
        const result = await response.json();

        // 받아온 데이터를 상태변수에 저장
        productDataList = result;

        // 동기적으로 렌더링()
        renderProducts(productDataList);
    }

     
    // productDataList 데이터들을 기반으로 렌더링하는 함수
    const renderProducts = (productDataList) => {
        // 기존에 있던 HTML을 삭제(중복 렌더링방지)
        productList.innerHTML = "";

        let myHtml = "";
        // 상품 하나당 카드 하나 만들어서 붙혀줌
        for(let product of productDataList) {
            const cardHTML = createProductCardHTML(product);
            myHtml += cardHTML;
        }

        productList.innerHTML = myHtml;
    }

    
    // HTML 조립하는 함수
    const createProductCardHTML = (product) => {
        const { image, title, price, id } = product;
        // 버튼을 누르면, product의 id를 추출할 수 있게
        // 전역에 있는 productDataList에서 id로 해당 상품을 특정해서
        // localStorage에 담아줄겁니다.
        const html = `
            <div class="product-card">
                <div class="image-box">
                    <img src="${image}" alt="${title}"/>
                </div>
                <h3 class="title">${title}</h3>
                <p class="price">$${price}</p>
                <button data-productId="${id}">상품담기</button>
            </div>
        `;
        return html;
    }

    // productList안에 card들을 만들어 줬음
    // card안에 버튼에서 이벤트가 생성이 되고, -> 전파.. -> productList에서 감지될것임
    productList.addEventListener("click", (e) => {
        // 버튼이 아니면, 바로 리턴
        const target = e.target;
        const targetName = target.tagName;
        
        if (targerName !== "BUTTON") {
            return;
        }

        // 진짜로 복습을 해야 할것 같다
        
        // 이래부분은 button만 동작한다
        // 클릭한 버튼의 data-id를 가져와야 함
        const productId = target.setdata.proudctId;
        productId = parseInt(productId); // 숫자로 -> 숫자

        
        // id로 productDataList에서 상품을 가져옴(js객체)
        // let selectedProduct = {};
        // for (let productData of productDataList) {
        //     if (product.id === productId){
        //         selectedProduct = product;
        //         break;
        //     }
        // }

        // or findAPI사용 가능

        let selectedProduct = productDataList.find((product) => {
            return product.id === productId;
        })

        // 최초면, localStorage에 아무것도 없음
        // 삼항연산자 사용
        const savedCart = localStorage.getItem("cart");
        
        // 최초면, falsy, 최초가 아니면, trurhy
        // 값 ? truthy일때 값 : falsy일때 값 --
        const cart = savedCart ? JSON.parse(savedCart) : [];
        
        // localStorage에 이미 상품이 존재한다면? 수량 증가
        // 없다면, 새로 추가한다 -> cart에 해당 id의 상품이 있는지 검사해야 한다
        const existingItem = cart.find((product) => {
            return product.id === selectedProduct.id
        });
        
        if (existingItem){ // cart에 이미 값이 있다면
            existingItem.count += 1;    
        } else { // 없다면
            const {id, title, price, image} = selectedProduct;
            const newItem = {
                id : id,
                title : title,
                price : price,
                image : image,
                count: 1
            }
            cart.push(newItem);
        }


        // 로컬스토리지에 저장하기
        const savingData = JSON.stringify(cart);
        localStorage.setItem("cart", savingData);
    })
    // 다음시간까지 무조건 복습 해라 그전것까지 제발...
    loadProducts();
</script>
</html>
