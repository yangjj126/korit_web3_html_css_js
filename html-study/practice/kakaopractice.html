<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./kakaopractice.css">
    <title>Document</title>
</head>
<body>
    <main class="all">
        <div class="logo">Kakao</div>
        <section class="box">

            <!-- 1. 로그인 메인 창 -->
            <div class="most">
                <input 
                    type="text"
                    placeholder="카카오메일,아이디,이메일,전화번호"
                >
                <input
                    type="password"
                    placeholder="비밀번호"
                >
            </div>

            <!-- 2. 간편로그인 -->
            <div class="check">
                <input type="checkbox">
                <label for="checkbox">간편로그인 정보 저장</label>
            <div/>

            <!-- 3. 로그인 QR코드 및 로그인 -->
            <div class="login-group">
                <div class="login">로그인</div>
                <span class="else">또는</span>
                <div>QR코드 로그인</div>
            </div>
            

            <!-- 4. 아래 코드들 -->
            <div class="id">
                <span class="gay">회원가입</span>
                <span>계정 찾기 | 비밀번호 찾기</span>
            </div>

        </section>
    </main>
</body>
</html>
