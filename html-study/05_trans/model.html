<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./model.css">
    <title>Model</title>
</head>
<body>
    <!-- 모달창(팝업 창) -->
    <!--
    클릭 이벤트기반으로 동작하는 ui
    실제로는 js으로 구현 됨

    css로 구현할수 있기는 함
    -->
    <input 
        type="checkbox"
        id="model-toggle"
        hidden
    />

    <!-- 버튼 역할 -->
    <label for="model-toggle" class="open-btn">모달 열기</label>
    <!-- 모달(평소에는 숨겨져있음) -->
    <div class="model-bg">
        <!-- model-bg가 전체 창을 가린다 -->
        <div class="modal"> 
            <h2>모달창이에요</h2>
            <p>내용 입니다</p>
            <label for="model-toggle" class="close-btn">닫기</label>
        </div>
    </div>
    <!-- 원래 컨텐츠 -->
    <div>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Sed mollitia delectus ullam consectetur assumenda itaque natus atque. Explicabo reprehenderit impedit officia ea omnis itaque labore, dolores, ullam repellat suscipit cupiditate.</p>
    </div>
</body>
</html>
